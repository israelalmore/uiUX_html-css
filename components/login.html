<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión | Forever Events</title>

    <link rel="stylesheet" href="/Assets/css/main.css" />
    <link rel="stylesheet" href="/Assets/css/pages/login.css" />
  </head>

  <body>
    <main class="auth">
      <!-- Branding compacto -->
      <section class="auth-brand">
        <a
          href="landingPage.html"
          class="brand-logo"
          aria-label="Forever Events inicio"
        >
          <img
            src="/Assets/img/logoForever.png"
            alt="Logotipo de Forever Events"
          />
        </a>
        <h1>Forever Events</h1>
        <p>Gestiona tus eventos con control total y precisión profesional.</p>
      </section>

      <!-- Login -->
      <section class="auth-card" role="main" aria-labelledby="login-title">
        <header class="auth-header">
          <h2 id="login-title">Iniciar sesión</h2>
          <span>Accede a tu panel seguro</span>
        </header>

        <form action="login.php" method="post" class="auth-form" novalidate>
          <div class="form-group">
            <label for="user">Correo electrónico</label>
            <input
              type="email"
              id="user"
              name="user"
              placeholder="ejemplo@correo.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Introduce tu contraseña"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="auth-options">
            <a href="forgotPassword.html">¿Olvidaste tu contraseña?</a>
          </div>

          <button type="submit" class="primary-btn">Iniciar sesión</button>
        </form>

        <footer class="auth-footer">
          <span>¿No tienes cuenta?</span>
          <a href="register.html">Crear cuenta</a>
        </footer>
      </section>
    </main>
  </body>
</html>
