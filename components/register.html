<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/Assets/css/main.css" />
  </head>
  <body>
    <header class="nav-bar-login">
      <a href="landingPage.html" aria-label="Forever Events inicio">
        <img
          class="logo"
          src="/Assets/img/logoForever.png"
          alt="Logotipo de Forever Events"
        />
      </a>
    </header>

    <main>
      <section class="register-section">
        <header>
          <h1>Crear Cuenta</h1>
        </header>
        <form class="register-form">
          <div class="register-grid">
            
            <aside class="avatar" aria-hidden="true"></aside>
            
            <div class="field">
              <label for="nombre">Nombre</label>
              <input id="nombre" type="text" placeholder="Introduce tu nombre" required />
            </div>
            
            <div class="field">
              <label for="idioma">Idioma</label>
              <select id="idioma">
                <option>Español</option>
                <option>Inglés</option>
                <option>Catalán</option>
              </select>
            </div>

            <div class="field">
              <label for="apellido1">Primer Apellido</label>
              <input id="apellido1" type="text" placeholder="Introduce tu primer apellido" required />
            </div>

            <div class="field">
              <label for="apellido2">Segundo Apellido</label>
              <input id="apellido2" type="text" placeholder="Introduce tu segundo apellido"/>
            </div>

            <div class="field">
              <label for="fecha">Fecha de Nacimiento</label>
              <input id="fecha" type="date" required />
            </div>

            <div class="field full">
              <label for="correo">Correo Electrónico</label>
              <input id="correo" type="email" placeholder="Introduce tu correo electrónico" required />
            </div>

            <div class="field full">
              <label for="telefono">Teléfono</label>
              <input id="telefono" type="tel" placeholder="Introduce tu número de teléfono" required />
            </div>

            <div class="field full">
              <label for="tipo_doc">Tipo de Documento</label>
              <select id="tipo_doc" required>
                <option>DNI</option>
                <option>NIE</option>
                <option>NIF</option>
              </select>
            </div>

            <div class="field full">
              <label for="doc">Documento de Identidad</label>
              <input id="doc" type="text" placeholder="Introduce tu documento de identidad" required />
            </div>

            <div class="field full">
              <label for="ciudad">Ciudad</label>
              <input id="ciudad" type="text" placeholder="Introduce tu ciudad" />
            </div>

            <div class="field full">
              <label for="cp">Código Postal</label>
              <input id="cp" type="number" placeholder="Introduce tu código de postal" />
            </div>

            <div class="field full">
              <label for="provincia">Provincia</label>
              <input id="provincia" type="text" placeholder="Introduce tu provincia" />
            </div>

            <div class="field full">
              <label for="pass">Clave de Acceso</label>
              <input id="pass" type="password" placeholder="Introduce una clave de acceso" required />
            </div>

            <div class="field full">
              <label for="pass2">Repetir Clave de Acceso</label>
              <input id="pass2" type="password" placeholder="Vuelve a introducir la clave de acceso" required />
            </div>

            <div class="actions full">
              <button type="submit">Crear Cuenta</button>
            </div>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
