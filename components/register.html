<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/Assets/css/pages/register.css" />
    <link rel="stylesheet" href="/Assets/css/main.css" />
    <link rel="stylesheet" href="/Assets/css/components/babyNavBar.css" />
  </head>
  <body>
    <header class="nav-bar-login">
      <a href="landingPage.html" aria-label="Forever Events inicio">
        <img
          class="logo"
          src="/Assets/img/logoForever.png"
          alt="Logotipo de Forever Events"
        />
      </a>
    </header>
    <main class="register">
      <section class="register-hero">
        <h1>Crear Cuenta</h1>
        <p>
          Accede a Forever Events y empieza a gestionar tus eventos con control
          total.
        </p>
      </section>
      <section
        class="register-card"
        role="main"
        aria-labelledby="register-title"
      >
        <form class="register-form" novalidate>
          <div class="form-block">
            <h2 id="register-title">Información personal</h2>

            <div class="form-row">
              <div class="field">
                <label for="name">Nombre</label>
                <input id="name" type="text" required />
              </div>

              <div class="field">
                <label for="surname1">Primer apellido</label>
                <input id="surname1" type="text" required />
              </div>
            </div>

            <div class="field">
              <label for="surname2">Segundo apellido</label>
              <input id="surname2" type="text" />
            </div>

            <div class="field">
              <label for="date">Fecha de nacimiento</label>
              <input id="date" type="date" required />
            </div>
          </div>

          <div class="form-block">
            <h2>Contacto</h2>

            <div class="field">
              <label for="email">Correo electrónico</label>
              <input id="email" type="email" required />
            </div>

            <div class="field">
              <label for="telephone">Teléfono</label>
              <input id="telephone" type="tel" required />
            </div>

            <div class="field">
              <label for="language">Idioma</label>
              <select id="language">
                <option>Español</option>
                <option>Inglés</option>
                <option>Catalán</option>
              </select>
            </div>
          </div>

          <div class="form-block">
            <h2>Identificación</h2>

            <div class="field">
              <label for="type_doc">Tipo de documento</label>
              <select id="type_doc" required>
                <option>DNI</option>
                <option>NIE</option>
                <option>NIF</option>
              </select>
            </div>

            <div class="field">
              <label for="document">Documento</label>
              <input id="document" type="text" required />
            </div>
          </div>

          <div class="form-block">
            <h2>Dirección</h2>

            <div class="form-row">
              <div class="field">
                <label for="city">Ciudad</label>
                <input id="city" type="text" />
              </div>

              <div class="field">
                <label for="postal_code">Código postal</label>
                <input id="postal_code" type="number" />
              </div>
            </div>

            <div class="field">
              <label for="province">Provincia</label>
              <input id="province" type="text" />
            </div>
          </div>

          <div class="form-block">
            <h2>Seguridad</h2>

            <div class="field">
              <label for="pass">Clave de acceso</label>
              <input id="pass" type="password" required />
            </div>

            <div class="field">
              <label for="pass2">Repetir clave</label>
              <input id="pass2" type="password" required />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="primary-btn">Crear cuenta</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
